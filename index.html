<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFE0">
<title>Really you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* "Siegel": cream paper, petrol ink, small print, a guilloche seal on the result. One task per screen. */
:root {
  --paper: #F4EFE0;
  --card: #FBF8F0;
  --ink: #1B2B2F;
  --muted: #5C6660;
  --line: #D9CFB4;
  --petrol: #0F4C5C;
  --petrol-dark: #0B3742;
  --on-petrol: #F7F2E6;
  --green: #2F6F4F;
  --seal-green: #3A7D5C;
  --gold: #8C6D2C;
  --seal-gold: #B08D3C;
  --oxblood: #8B2E2E;
  --focus: #B08D3C;
  --display: "Fraunces", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); font-size: 19px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
main { max-width: 32rem; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 18px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding: 12px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; letter-spacing: .16em; color: var(--petrol); }
.kind { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--gold); }
.steps { display: flex; gap: 6px; margin: 20px 0 8px; list-style: none; padding: 0; }
.steps li { flex: 1; height: 4px; background: var(--line); border-radius: 2px; }
.steps li.on { background: var(--petrol); }
.steplabel { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 0 0 18px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 32px; line-height: 1.12; margin: 0 0 14px; text-wrap: balance; color: var(--ink); }
p { margin: 0 0 16px; }
.who { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; margin: 0 0 22px; display: flex; flex-direction: column; gap: 2px; }
.who small { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--gold); text-transform: uppercase; }
.who span { font-size: 17px; }
.who b { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--petrol); }
.btn { display: block; width: 100%; min-height: 58px; font: 600 19px var(--sans); color: var(--on-petrol); background: var(--petrol); border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; text-align: center; }
.btn:active { background: var(--petrol-dark); }
.btn:focus-visible, input:focus-visible, .tile:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.btn:disabled { opacity: .55; }
label { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
input { width: 100%; font: 500 30px var(--mono); letter-spacing: .3em; padding: 10px 12px; border: 2px solid var(--petrol); border-radius: 10px; background: var(--card); color: var(--ink); margin: 0 0 18px; }
.phone { display: block; margin: 8px auto 22px; }
@media (prefers-reduced-motion: no-preference) {
  .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.05); } }
  .seal .ring { animation: draw 1.2s ease-out both; }
  @keyframes draw { from { opacity: 0; transform: rotate(-12deg) scale(.96); } to { opacity: 1; transform: none; } }
}
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 18px; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.tile { aspect-ratio: 1; width: 100%; padding: 0; border: 3px solid transparent; border-radius: 6px; background: var(--line); cursor: pointer; overflow: hidden; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile:active { border-color: var(--petrol); }
.err { color: var(--oxblood); font-weight: 600; border: 1px solid var(--oxblood); border-radius: 10px; padding: 8px 12px; margin: 0 0 16px; background: #F4E1DC; }
.result { text-align: center; }
.seal { display: block; margin: 0 auto 12px; }
.seal .ring { transform-origin: 150px 150px; }
.result h1 { font-size: 42px; margin-bottom: 10px; }
.result-ok h1 { color: var(--seal-green); }
.result-fail h1 { color: var(--oxblood); }
.meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; margin: 6px 0 18px; font-family: var(--mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.meta small { display: block; font-size: 11px; color: var(--gold); letter-spacing: .14em; }
footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="14" fill="none" stroke="#B08D3C" stroke-width="0.8"/>
        <circle cx="15" cy="15" r="11.5" fill="none" stroke="#0F4C5C" stroke-width="0.8"/>
        <circle cx="15" cy="15" r="8.5" fill="#0F4C5C"/>
        <path d="M11.2 15.2l2.6 2.6 5-5.4" fill="none" stroke="#F7F2E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      REALLY YOU?
    </span>
    <span class="kind" id="kind"></span>
  </header>
  <ol class="steps" aria-hidden="true"><li id="s1"></li><li id="s2"></li><li id="s3"></li></ol>
  <p class="steplabel" id="steplabel"></p>
  <div id="view"></div>
  <footer id="footer"></footer>
</main>

<script>
"use strict";
const TEXT = {
  de: {
    kind: "IDENTITÄTSPRÜFUNG",
    step: (n) => `Schritt ${n} von 3`,
    footer: "Diese Seite fragt nie nach Passwörtern, PINs oder Bankdaten.",
    codeTitle: "Code eingeben",
    codeText: "Die Person, die dich prüft, nennt dir einen 6-stelligen Code.",
    codeLabel: "6-stelliger Code",
    connect: "Weiter",
    connecting: "Verbinde…",
    waitTitle: "Einen Moment",
    waitText: "Die andere Seite bereitet die Prüfung vor.",
    whoLabel: "Prüft dich gerade",
    whoText: "möchte sicher sein, dass du es wirklich bist.",
    cardTitle: "Halte deine Keycard hinten ans Handy",
    cardText: "Tippe zuerst auf den Knopf. Halte dann deine Keycard, deinen Ring oder Schlüsselanhänger flach an die Rückseite dieses Handys, bis es fertig ist.",
    cardBtn: "Keycard jetzt anhalten",
    cardRetry: "Das hat nicht geklappt. Tippe nochmal auf den Knopf und halte die Karte länger still.",
    cardUnsupported: "Dieser Browser kann keine Keycards lesen. Öffne den Link in Chrome (Android) oder Safari (iPhone).",
    photoTitle: (r, n) => `Welches Foto kennst du? (${r} von ${n})`,
    photoText: "Nur eines dieser Bilder stammt aus euren gemeinsamen Momenten. Tippe es an.",
    photoLoading: "Fotos werden geladen…",
    photoAlt: (i) => `Foto ${i}`,
    checking: "Wird geprüft…",
    checkingText: "Einen Moment, das Ergebnis kommt gleich.",
    okTitle: "Bestätigt",
    okText: (by) => `${by} sieht jetzt, dass du es bist. Du kannst diese Seite schließen.`,
    failTitle: "Nicht bestätigt",
    failText: (by) => `${by} konnte nicht bestätigen, dass du es bist. Klärt es am besten über eine bekannte Nummer.`,
    errorTitle: "Verbindung unterbrochen",
    errorText: "Bitte die Person, die dich prüft, um einen neuen Link.",
    metaMethod: "Methode",
    metaTime: "Zeit",
    metaBy: "Geprüft von",
    metaResult: "Ergebnis",
    methodCard: "Keycard",
    methodPhoto: "Foto-Check",
    resultOk: "Bestätigt",
    resultFail: "Abgelehnt",
    someone: "Die Person",
  },
  en: {
    kind: "IDENTITY CHECK",
    step: (n) => `Step ${n} of 3`,
    footer: "This page never asks for passwords, PINs or bank details.",
    codeTitle: "Enter the code",
    codeText: "The person checking you will tell you a 6-digit code.",
    codeLabel: "6-digit code",
    connect: "Continue",
    connecting: "Connecting…",
    waitTitle: "One moment",
    waitText: "The other side is preparing the check.",
    whoLabel: "Checking you now",
    whoText: "wants to be sure it's really you.",
    cardTitle: "Hold your key card to the back of the phone",
    cardText: "Tap the button first. Then hold your key card, ring or keychain flat against the back of this phone until it's done.",
    cardBtn: "Hold key card now",
    cardRetry: "That didn't work. Tap the button again and hold the card still for longer.",
    cardUnsupported: "This browser can't read key cards. Open the link in Chrome (Android) or Safari (iPhone).",
    photoTitle: (r, n) => `Which photo do you know? (${r} of ${n})`,
    photoText: "Only one of these pictures is from your shared moments. Tap it.",
    photoLoading: "Loading photos…",
    photoAlt: (i) => `Photo ${i}`,
    checking: "Checking…",
    checkingText: "One moment, the result is on its way.",
    okTitle: "Confirmed",
    okText: (by) => `${by} now sees that it's you. You can close this page.`,
    failTitle: "Not confirmed",
    failText: (by) => `${by} couldn't confirm it's you. Best sort it out on a number you both know.`,
    errorTitle: "Connection lost",
    errorText: "Ask the person checking you for a new link.",
    metaMethod: "Method",
    metaTime: "Time",
    metaBy: "Checked by",
    metaResult: "Result",
    methodCard: "Key card",
    methodPhoto: "Photo check",
    resultOk: "Confirmed",
    resultFail: "Declined",
    someone: "The other person",
  },
};
const L = (navigator.language || "de").toLowerCase().startsWith("de") ? TEXT.de : TEXT.en;
document.documentElement.lang = L === TEXT.de ? "de" : "en";
document.getElementById("footer").textContent = L.footer;
document.getElementById("kind").textContent = L.kind;

const DEFAULT_SERVER = "https://ntfy.sh";
const view = document.getElementById("view");
const S = { secret: null, server: DEFAULT_SERVER, topic: null, by: null, method: null, lastId: null, greeted: false, stopped: false, busy: false };

// ---------- helpers ----------
const enc = new TextEncoder();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function sha256(str) { return new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(str))); }
function b64d(s) { const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
function b64e(bytes) { let s = ""; bytes.forEach((b) => (s += String.fromCharCode(b))); return btoa(s); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function byName() { return esc(S.by || L.someone); }

function setStep(n) {
  [1, 2, 3].forEach((i) => document.getElementById("s" + i).classList.toggle("on", i <= n));
  document.getElementById("steplabel").textContent = L.step(n);
}
function render(html, step) { setStep(step); view.innerHTML = html; const f = view.querySelector("h1"); if (f) { f.tabIndex = -1; f.focus({ preventScroll: true }); } }
function whoBox() { return S.by ? `<div class="who"><small>${L.whoLabel}</small><span><b>${byName()}</b> ${L.whoText}</span></div>` : ""; }

async function topicFor(secret) {
  const a = "abcdefghijklmnopqrstuvwxyz234567";
  const h = await sha256("reallyyou-session|" + secret);
  let t = "rys";
  for (let i = 0; i < 24; i++) t += a[h[i] & 31];
  return t;
}

async function publish(obj) {
  try {
    const res = await fetch(`${S.server}/${S.topic}`, { method: "POST", body: JSON.stringify(obj) });
    return res.ok;
  } catch (e) { return false; }
}

// ---------- screens ----------
function showCodeEntry(error) {
  render(`
    <h1>${L.codeTitle}</h1>
    <p>${L.codeText}</p>
    ${error ? `<p class="err">${error}</p>` : ""}
    <form id="f">
      <label for="code">${L.codeLabel}</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <button class="btn" type="submit">${L.connect}</button>
    </form>`, 1);
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const code = document.getElementById("code").value.replace(/\D/g, "");
    if (code.length === 6) { S.secret = code; start(); }
  });
}

function showWaiting() {
  render(`${whoBox()}<h1>${L.waitTitle}</h1><p>${L.waitText}</p>`, 1);
}

function phoneSvg() {
  return `<svg class="phone" width="210" height="200" viewBox="0 0 210 200" aria-hidden="true">
    <rect x="62" y="14" width="86" height="170" rx="14" fill="#FBF8F0" stroke="#0F4C5C" stroke-width="3"/>
    <circle cx="105" cy="72" r="34" fill="none" stroke="#B08D3C" stroke-width="1" opacity="0.7"/>
    <circle cx="105" cy="72" r="25" fill="none" stroke="#0F4C5C" stroke-width="3" class="pulse"/>
    <circle cx="105" cy="72" r="11" fill="#0F4C5C"/>
    <rect x="118" y="96" width="74" height="46" rx="6" fill="#B08D3C" stroke="#1B2B2F" stroke-width="3" transform="rotate(-12 155 119)"/>
    <rect x="132" y="110" width="16" height="12" rx="2" fill="#1B2B2F" transform="rotate(-12 155 119)"/>
  </svg>`;
}

function showCard(challenge, handles, error) {
  S.method = "card";
  const supported = !!(window.PublicKeyCredential && navigator.credentials);
  render(`${whoBox()}
    <h1>${L.cardTitle}</h1>
    ${phoneSvg()}
    <p>${L.cardText}</p>
    ${error ? `<p class="err">${error}</p>` : ""}
    ${supported ? `<button class="btn" id="go">${L.cardBtn}</button>` : `<p class="err">${L.cardUnsupported}</p>`}`, 2);
  if (!supported) return;
  document.getElementById("go").addEventListener("click", async (e) => {
    if (S.busy) return;
    S.busy = true;
    e.target.disabled = true;
    try {
      const cred = await navigator.credentials.get({
        publicKey: {
          challenge: b64d(challenge),
          rpId: location.hostname,
          allowCredentials: handles.map((h) => ({ type: "public-key", id: b64d(h), transports: ["nfc", "usb"] })),
          userVerification: "discouraged",
          timeout: 120000,
        },
      });
      const r = cred.response;
      showChecking();
      const ok = await publish({
        t: "card_response", s: "p",
        kh: b64e(new Uint8Array(cred.rawId)),
        ad: b64e(new Uint8Array(r.authenticatorData)),
        cd: b64e(new Uint8Array(r.clientDataJSON)),
        sig: b64e(new Uint8Array(r.signature)),
      });
      if (!ok) showError();
    } catch (err) {
      showCard(challenge, handles, L.cardRetry);
    } finally {
      S.busy = false;
    }
  });
}

async function showPhotos(url, round, total) {
  S.method = "photo";
  render(`${whoBox()}<h1>${L.photoTitle(round, total)}</h1><p>${L.photoLoading}</p>`, 2);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("download");
    const data = new Uint8Array(await res.arrayBuffer());
    const key = await crypto.subtle.importKey("raw", await sha256("reallyyou-photo|" + S.secret), "AES-GCM", false, ["decrypt"]);
    const plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12)));
    const dv = new DataView(plain.buffer, plain.byteOffset, plain.byteLength);
    let p = 0;
    const count = plain[p++];
    const urls = [];
    for (let i = 0; i < count; i++) {
      const len = dv.getInt32(p); p += 4;
      urls.push(URL.createObjectURL(new Blob([plain.slice(p, p + len)], { type: "image/jpeg" })));
      p += len;
    }
    render(`${whoBox()}
      <h1>${L.photoTitle(round, total)}</h1>
      <p>${L.photoText}</p>
      <div class="grid">${urls.map((u, i) => `<button class="tile" data-i="${i}" aria-label="${L.photoAlt(i + 1)}"><img src="${u}" alt=""></button>`).join("")}</div>`, 2);
    view.querySelectorAll(".tile").forEach((b) => b.addEventListener("click", async () => {
      if (S.busy) return;
      S.busy = true;
      showChecking();
      const ok = await publish({ t: "photo_pick", s: "p", r: round, i: Number(b.dataset.i) });
      S.busy = false;
      if (!ok) showError();
    }));
  } catch (e) {
    showError();
  }
}

function showChecking() {
  render(`${whoBox()}<h1>${L.checking}</h1><p>${L.checkingText}</p>`, 2);
}

// Banknote-style guilloche rosette. Not confirmed: oxblood, with gaps in the rings.
function seal(ok) {
  const main = ok ? "#3A7D5C" : "#8B2E2E";
  const inner = ok ? "#B08D3C" : "#8B2E2E";
  let outer = "", small = "";
  for (let i = 0; i < 24; i++) {
    if (!ok && i % 8 === 3) continue;
    outer += `<ellipse cx="150" cy="150" rx="140" ry="52" transform="rotate(${i * 7.5} 150 150)"/>`;
  }
  for (let i = 0; i < 12; i++) {
    if (!ok && i % 6 === 2) continue;
    small += `<ellipse cx="150" cy="150" rx="92" ry="34" transform="rotate(${i * 15} 150 150)"/>`;
  }
  const mark = ok
    ? `<path d="M124 152 l18 18 l36 -40" fill="none" stroke="#F7F2E6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`
    : `<path d="M130 130 l40 40 M170 130 l-40 40" stroke="#F7F2E6" stroke-width="9" stroke-linecap="round"/>`;
  return `<svg class="seal" width="250" height="250" viewBox="0 0 300 300" aria-hidden="true">
    <g class="ring" fill="none" stroke="${main}" stroke-width="0.9" opacity="0.6">${outer}</g>
    <g class="ring" fill="none" stroke="${inner}" stroke-width="0.8" opacity="0.7">${small}</g>
    <circle cx="150" cy="150" r="54" fill="${main}"/>
    <circle cx="150" cy="150" r="47" fill="none" stroke="#F7F2E6" stroke-width="1.5"/>
    ${mark}
  </svg>`;
}

function showResult(ok) {
  const time = new Date().toLocaleTimeString(document.documentElement.lang, { hour: "2-digit", minute: "2-digit" });
  const method = S.method === "photo" ? L.methodPhoto : S.method === "card" ? L.methodCard : "–";
  render(`<div class="result ${ok ? "result-ok" : "result-fail"}">${seal(ok)}
    <h1>${ok ? L.okTitle : L.failTitle}</h1>
    <p>${ok ? L.okText(byName()) : L.failText(byName())}</p>
    <div class="meta">
      <div><small>${L.metaMethod}</small>${method}</div>
      <div><small>${L.metaTime}</small>${time}</div>
      <div><small>${L.metaBy}</small>${byName()}</div>
      <div><small>${L.metaResult}</small>${ok ? L.resultOk : L.resultFail}</div>
    </div></div>`, 3);
}

function showError() {
  S.stopped = true;
  render(`<h1>${L.errorTitle}</h1><p>${L.errorText}</p>`, 3);
}

// ---------- connection ----------
function onEvent(e) {
  if (e.event !== "message") return;
  S.lastId = e.id;
  let m;
  try { m = JSON.parse(e.message); } catch (x) { return; }
  if (!m || m.s !== "a") return;
  if (m.by) S.by = m.by;
  if (m.t === "card_challenge") showCard(m.ch, m.kh || []);
  else if (m.t === "photo_round" && e.attachment && e.attachment.url) showPhotos(e.attachment.url, m.r, m.n || 3);
  else if (m.t === "done") { S.stopped = true; showResult(!!m.ok); }
}

async function listen() {
  const startTs = Math.floor(Date.now() / 1000);
  let failures = 0;
  while (!S.stopped) {
    try {
      const since = S.lastId || startTs;
      const res = await fetch(`${S.server}/${S.topic}/json?since=${since}`);
      if (!res.ok || !res.body) throw new Error("http");
      failures = 0;
      if (!S.greeted) {
        S.greeted = true;
        if (!(await publish({ t: "hello", s: "p" }))) { showError(); return; }
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (!S.stopped) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, i).trim();
          buf = buf.slice(i + 1);
          if (line) { try { onEvent(JSON.parse(line)); } catch (x) { /* ignore */ } }
        }
      }
      try { reader.cancel(); } catch (x) { /* ignore */ }
    } catch (e) {
      failures++;
      if (failures > 8) { showError(); return; }
    }
    if (!S.stopped) await sleep(2000);
  }
}

async function start() {
  render(`<h1>${L.connecting}</h1>`, 1);
  S.topic = await topicFor(S.secret);
  showWaiting();
  listen();
}

// ---------- boot ----------
(function boot() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (hash) {
    const [secret, server] = hash.split("|");
    S.secret = secret;
    if (server && /^https:\/\//.test(server)) S.server = server.replace(/\/+$/, "");
    history.replaceState(null, "", location.pathname);
    start();
  } else {
    showCodeEntry();
  }
})();
</script>
</body>
</html>
